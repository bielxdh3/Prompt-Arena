name: Native Tauri acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-ui:
    name: Native UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri/WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            wget \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native app without installer bundling
        run: npm run tauri:build -- --debug --no-bundle

      - name: Stage development sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostLine = rustc -vV | Select-String '^host:' | Select-Object -First 1
          if (-not $hostLine) { throw 'rustc host target not found' }
          $triple = ($hostLine.Line -split '\s+')[1]
          $source = "src-tauri/target/$triple/release/prompt-arena-worker.exe"
          $destination = 'src-tauri/target/debug/prompt-arena-worker.exe'
          if (-not (Test-Path -LiteralPath $source)) { throw "worker missing: $source" }
          Copy-Item -LiteralPath $source -Destination $destination -Force
          Get-Item -LiteralPath $destination | Format-List FullName,Length

      - name: Stage development sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | awk '/^host:/ {print $2; exit}')"
          source="src-tauri/target/${triple}/release/prompt-arena-worker"
          destination="src-tauri/target/debug/prompt-arena-worker"
          test -x "$source"
          cp "$source" "$destination"
          chmod +x "$destination"
          ls -l "$destination"

      - name: Native Tauri acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/native-ui-smoke.mjs "src-tauri/target/debug/prompt-arena.exe"

      - name: Native Tauri acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/native-ui-smoke.mjs "src-tauri/target/debug/prompt-arena"
