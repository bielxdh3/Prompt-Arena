# This workflow only validates and packages candidates. Publishing stays disabled
# until a server-enforced publisher boundary protects against branch workflow copies.
name: Validate release candidate (publishing disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 0.1.4
      ref:
        description: Exact reviewed 40-character commit SHA merged to main
        required: true
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-candidate-${{ inputs.version || '0.1.4' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - name: Resolve candidate metadata
        id: meta
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Candidate version must be a valid semantic version without a leading v." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release ref must be an exact 40-character commit SHA." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - name: Check out candidate ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0

      - name: Require an approved commit merged to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" FETCH_HEAD; then
            echo "Candidate commit is not reachable from main." >&2
            exit 1
          fi

          approved=false
          while IFS= read -r pull_number; do
            [ -n "$pull_number" ] || continue
            pull=$(gh api "repos/$REPOSITORY/pulls/$pull_number")
            base=$(jq -r '.base.ref' <<< "$pull")
            merged_at=$(jq -r '.merged_at // empty' <<< "$pull")
            merge_sha=$(jq -r '.merge_commit_sha // empty' <<< "$pull")
            head_sha=$(jq -r '.head.sha' <<< "$pull")
            author=$(jq -r '.user.login' <<< "$pull")
            if [ "$base" != "main" ] || [ -z "$merged_at" ] || [ "${merge_sha,,}" != "${CANDIDATE_SHA,,}" ]; then
              continue
            fi

            reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$pull_number/reviews" | jq -s 'add')
            reviewer_logins=$(jq -r --arg head "$head_sha" --arg author "$author" '
              group_by(.user.login)
              | map(sort_by(.submitted_at) | last)
              | .[]
              | select(.state == "APPROVED" and .commit_id == $head and .user.login != $author)
              | .user.login
            ' <<< "$reviews")
            while IFS= read -r reviewer; do
              [ -n "$reviewer" ] || continue
              permission=$(gh api "repos/$REPOSITORY/collaborators/$reviewer/permission" --jq '.permission')
              case "$permission" in
                write|maintain|admin)
                  approved=true
                  break
                  ;;
              esac
            done <<< "$reviewer_logins"
            if [ "$approved" = "true" ]; then
              break
            fi
          done < <(gh api --paginate --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .number' "repos/$REPOSITORY/commits/$CANDIDATE_SHA/pulls")

          if [ "$approved" != "true" ]; then
            echo "Candidate commit must be the merge commit of a reviewed pull request to main." >&2
            exit 1
          fi

      - name: Pin validated candidate commit
        id: commit
        shell: bash
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source version and notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SOURCE_VERSION=$(node -p "require('./package.json').version")
          test "$SOURCE_VERSION" = "$VERSION" || { echo "package.json=$SOURCE_VERSION but requested release=$VERSION" >&2; exit 1; }
          test -f "docs/releases/v${VERSION}.md" || { echo "Missing docs/releases/v${VERSION}.md" >&2; exit 1; }

  package:
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}
