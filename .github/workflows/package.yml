name: QA 0.1.4.5 package handoff

on:
  push:
    branches: [qa/package-0.1.4.5-download]

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build QA MSI 0.1.4.5
        shell: pwsh
        run: |
          $env:VITE_APP_VERSION = '0.1.4.5'
          npm run tauri:build -- --bundles msi --config src-tauri/tauri.qa.conf.json --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Tauri MSI bundling failed; applying repository WiX duplicate-worker correction.'
            node --input-type=module -e "import path from 'node:path'; import('./scripts/build-windows-msi.mjs').then(m => console.log(m.buildPatchedMsi('0.1.4.5', path.resolve('src-tauri/target/x86_64-pc-windows-msvc/release'))))"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify MSI and write checksum
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)." }
          New-Item -ItemType Directory -Force qa-artifact | Out-Null
          Copy-Item $msi[0].FullName 'qa-artifact/Prompt-Arena-0.1.4.5-windows-x64.msi'
          $hash = (Get-FileHash 'qa-artifact/Prompt-Arena-0.1.4.5-windows-x64.msi' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Prompt-Arena-0.1.4.5-windows-x64.msi" | Set-Content 'qa-artifact/Prompt-Arena-0.1.4.5-windows-x64.msi.sha256.txt'
          Write-Host "MSI_SHA256=$hash"

      - name: Upload QA MSI
        uses: actions/upload-artifact@v4
        with:
          name: prompt-arena-0.1.4.5-windows-x64
          path: qa-artifact/
          if-no-files-found: error
          retention-days: 2
